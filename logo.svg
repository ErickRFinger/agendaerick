<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="60%" stop-color="#111019" />
      <stop offset="100%" stop-color="#0a0910" />
    </radialGradient>
    
    <!-- Gold Beam Gradient -->
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldBeamAlt" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.85" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGlow)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5" />

  <!-- Outer Target Crosshairs -->
  <line x1="60" y1="12" x2="60" y2="24" stroke="url(#goldBeam)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="96" x2="60" y2="108" stroke="url(#goldBeam)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="12" y1="60" x2="24" y2="60" stroke="url(#goldBeam)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="96" y1="60" x2="108" y2="60" stroke="url(#goldBeam)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Target Reticle Arcs / Circle -->
  <circle cx="60" cy="60" r="38" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="14 6" opacity="0.75" />
  <circle cx="60" cy="60" r="27" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />

  <!-- Diagonal Sub-Crosshairs -->
  <line x1="28" y1="28" x2="35" y2="35" stroke="rgba(251, 191, 36, 0.5)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="92" y1="28" x2="85" y2="35" stroke="rgba(251, 191, 36, 0.5)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="28" y1="92" x2="35" y2="85" stroke="rgba(251, 191, 36, 0.5)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="92" y1="92" x2="85" y2="85" stroke="rgba(251, 191, 36, 0.5)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Ambient Glow Behind Star -->
  <circle cx="60" cy="60" r="16" fill="#f59e0b" opacity="0.3" filter="url(#goldGlow)" />

  <!-- Radiant Compass / Focus Star -->
  <!-- Diagonal Short Rays -->
  <polygon points="60,60 76,44 60,54 44,44" fill="url(#goldBeamAlt)" opacity="0.9" />
  <polygon points="60,60 76,76 60,66 44,76" fill="url(#goldBeamAlt)" opacity="0.9" />
  <polygon points="60,60 44,76 54,60 44,44" fill="url(#goldBeamAlt)" opacity="0.9" />
  <polygon points="60,60 76,76 66,60 76,44" fill="url(#goldBeamAlt)" opacity="0.9" />

  <!-- Cardinal Long Rays -->
  <!-- Top Ray -->
  <polygon points="60,20 63.5,52 60,56 56.5,52" fill="url(#goldBeam)" />
  <polygon points="60,20 60,56 56.5,52" fill="#d97706" opacity="0.65" />
  <!-- Bottom Ray -->
  <polygon points="60,100 63.5,68 60,64 56.5,68" fill="url(#goldBeam)" />
  <polygon points="60,100 60,64 56.5,68" fill="#d97706" opacity="0.65" />
  <!-- Left Ray -->
  <polygon points="20,60 52,63.5 56,60 52,56.5" fill="url(#goldBeam)" />
  <polygon points="20,60 56,60 52,56.5" fill="#d97706" opacity="0.65" />
  <!-- Right Ray -->
  <polygon points="100,60 68,63.5 64,60 68,56.5" fill="url(#goldBeam)" />
  <polygon points="100,60 64,60 68,56.5" fill="#d97706" opacity="0.65" />

  <!-- Central Focus Bullseye -->
  <circle cx="60" cy="60" r="5" fill="#ffffff" filter="url(#goldGlow)" />
  <circle cx="60" cy="60" r="2.2" fill="#f59e0b" />
</svg>
